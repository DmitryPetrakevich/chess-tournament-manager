name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download bbpPairings + build WinForms
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Upload ready-to-run Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ChessDraw-Windows-x64
          path: dist/**
